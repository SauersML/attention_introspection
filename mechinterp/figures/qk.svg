<svg width="2000" height="1480" viewBox="0 0 2000 1480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"><text x="30.0" y="66.0" font-size="46" font-weight="700" fill="#1D1D1F" text-anchor="start" >The instruction acts through the answer tokens&#x27; queries:</text><text x="30.0" y="124.0" font-size="46" font-weight="700" fill="#1D1D1F" text-anchor="start" >swapping in queries from a prompt naming another paragraph moves</text><text x="30.0" y="182.0" font-size="46" font-weight="700" fill="#1D1D1F" text-anchor="start" >attention there; swapping in keys does nothing</text><line x1="300" y1="1279.1676931916738" x2="1960" y2="1279.1676931916738" stroke="#1D1D1F" stroke-width="3"/><line x1="300" y1="330" x2="300" y2="1290" stroke="#1D1D1F" stroke-width="3"/><text x="284.0" y="1294.2" font-size="46" font-weight="400" fill="#1D1D1F" text-anchor="end" >0%</text><text x="284.0" y="884.7" font-size="46" font-weight="400" fill="#1D1D1F" text-anchor="end" >50%</text><text x="284.0" y="475.2" font-size="46" font-weight="400" fill="#1D1D1F" text-anchor="end" >100%</text><text x="90.0" y="810.0" font-size="46" font-weight="400" fill="#1D1D1F" text-anchor="middle" transform="rotate(-90 90 810.0)">attention moved to the</text><text x="150.0" y="810.0" font-size="46" font-weight="400" fill="#1D1D1F" text-anchor="middle" transform="rotate(-90 150 810.0)">newly named paragraph</text><line x1="300" y1="460.24546108574964" x2="1960" y2="460.24546108574964" stroke="#1D1D1F" stroke-width="3" stroke-dasharray="10 10"/><rect x="412.9" y="458.5" width="259.2" height="820.6" fill="#2B5FA8"/><line x1="542.5" y1="459.6" x2="542.5" y2="457.3" stroke="#1D1D1F" stroke-width="4"/><line x1="524.5" y1="459.6" x2="560.5" y2="459.6" stroke="#1D1D1F" stroke-width="4"/><line x1="524.5" y1="457.3" x2="560.5" y2="457.3" stroke="#1D1D1F" stroke-width="4"/><text x="542.5" y="437.3" font-size="46" font-weight="700" fill="#1D1D1F" text-anchor="middle" >100%</text><text